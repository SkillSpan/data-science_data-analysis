services:
  - type: web
    name: skillspan-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m app.assistant.rag.ingest
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: BACKEND_BASE_URL
        value: https://back-end-zdip.onrender.com
      - key: DATA_SCIENCE_SERVICE_TOKEN
        sync: false
      - key: BASELINE_INTERNAL_SECRET
        sync: false
      - key: BASELINE_MAPPING_TIMEOUT_SECONDS
        value: "8.0"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: RAG_ENABLED
        value: "true"
      - key: RAG_TOP_K
        value: "4"
      - key: RAG_MIN_SCORE
        value: "0.45"
      - key: EMBEDDING_MODEL
        value: "gemini-embedding-001"
